<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07030d" />
    <title>NIGHTRUN — OFFLINE</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; min-height: 100%; background: #05020a; color: #efe8ff;
        font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        display: grid; place-items: center; text-align: center; padding: 24px;
        background-image: radial-gradient(circle at 50% 20%, #170a2e 0%, #05020a 65%);
      }
      .mark {
        font-family: "Avenir Next Condensed", Impact, "Arial Narrow", sans-serif;
        font-size: clamp(34px, 12vw, 64px); letter-spacing: .12em; margin: 0 0 6px;
        text-shadow: 0 0 30px rgba(162,75,255,.85), 0 0 60px rgba(69,240,255,.35);
      }
      .sub { font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .42em; color: #a24bff; margin-bottom: 26px; }
      p { color: #b3a6d2; font-size: 14px; line-height: 1.6; max-width: 34ch; margin: 0 auto 20px; }
      a.btn {
        display: inline-block; text-decoration: none; color: #fff; font-weight: 700;
        letter-spacing: .18em; font-size: 13px; padding: 14px 26px;
        background: linear-gradient(100deg, #ff2f6d, #a24bff 55%, #2f6bff);
        clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
      }
      .hint { margin-top: 18px; font-family: ui-monospace, Menlo, monospace; font-size: 9px; letter-spacing: .22em; color: #6f608f; }
    </style>
  </head>
  <body>
    <div>
      <div class="mark">NIGHTRUN</div>
      <div class="sub">— NEON DISTRICT —</div>
      <p>
        The cached game shell was not found on this device. Reconnect once and reload —
        after that Nightrun runs with no connection at all.
      </p>
      <a class="btn" href="./index.html">RETRY</a>
      <div class="hint">TIP: ADD TO HOME SCREEN FOR OFFLINE PLAY</div>
    </div>
    <script>
      // If we come back online, try the game again automatically.
      addEventListener('online', () => {
        location.replace('./index.html');
      });
    </script>
  </body>
</html>
